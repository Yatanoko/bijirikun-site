<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美尻くん.com。</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>美尻くん.com</h1>

        <nav>
            <button id="howToButton">使い方</button>
        </nav>
    </header>


    <!-- メイン -->
    <main>

        <!-- 実際の絵 -->
        <section class="main-image">
            <div class="image-placeholder">
                <img src="images/main.jpg" alt="メイン画像">
            </div>
        </section>
        
        
<section class="whats-section">
    <nav>
        <button id="aboutButton">美尻くんって？</button>
    </nav>
</section>


        <!-- カメラで見つける -->
        <section class="camera-section">
            <button id="cameraButton">
                カメラで見つける
            </button>
        </section>


        <!-- 美九くんを探す -->
        <section class="search-section">

          
<div class="search-grid">

    <div class="search-row">
        <button class="search-item">
            <img src="images/1.jpg" alt="キャラクター1">
        </button>
        <button class="search-item">
            <img src="images/2.jpg" alt="キャラクター2">
        </button>
        <button class="search-item">
            <img src="images/3.jpg" alt="キャラクター3">
        </button>
    </div>

    <div class="search-row">
        <button class="search-item">
            <img src="images/4.jpg" alt="キャラクター4">
        </button>
        <button class="search-item">
            <img src="images/5.jpg" alt="キャラクター5">
        </button>
    </div>

    <div class="search-row">
        <button class="search-item">
            <img src="images/6.jpg" alt="キャラクター6">
        </button>
        <button class="search-item">
            <img src="images/7.jpg" alt="キャラクター7">
        </button>
    </div>

</div>

        </section>

    </main>


    <!-- 遊び方ポップアップ -->
    <div id="howToModal" class="modal">

        <div class="modal-content">

            <button class="close-button">×</button>

            <h2>遊び方</h2>

            <div class="modal-body">
                ここに遊び方の説明
            </div>

        </div>

    </div>

<!-- カメラ認識画面 -->
<a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets(1).mind; autoStart: false;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
    </a-entity>

</a-scene>
    <button id="backButton" style="display: none; position: fixed; top: 20px; left: 20px; z-index: 10001;">
    ← サイトに戻る
    
</button>
    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
